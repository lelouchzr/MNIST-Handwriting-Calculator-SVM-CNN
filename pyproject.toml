[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkcalc"
version = "0.1.0"
description = "A handwriting-first math workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "scikit-image>=0.25,<1",
  "joblib>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/inkcalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
