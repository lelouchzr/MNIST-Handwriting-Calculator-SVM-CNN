[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkcalc"
version = "0.1.0"
description = "MNIST handwriting calculator comparing HOG + SVM and CNN recognition"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mnist", "handwriting-recognition", "calculator", "svm", "cnn"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "scikit-image>=0.25,<1",
  "scipy>=1.15,<2",
  "joblib>=1.4,<2",
  "torch>=2.15,<3",
]

[project.urls]
Repository = "https://github.com/lelouchzr/MNIST-Handwriting-Calculator-SVM-CNN"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/inkcalc"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
